<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dispenser Detector</title>
    <style>
        /* 完全に白背景の中央配置スタイル */
        body { 
            background-color: #ffffff; 
            margin: 0; 
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* 接続用UIのコンテナ */
        #setup-ui {
            position: absolute;
            z-index: 10;
            text-align: center;
        }

        button { 
            font-size: 18px; 
            padding: 12px 24px; 
            cursor: pointer; 
            background-color: #333; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #555; }
        #status { margin-top: 10px; color: #888; font-size: 14px;}
        
        /* 全画面表示用の画像スタイル */
        #displayImage {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 縦横比を崩さずに画面いっぱいに表示 */
        }
    </style>
</head>
<body>

    <!-- 接続完了後に丸ごと非表示にするエリア -->
    <div id="setup-ui">
        <button id="connectBtn">Connect to MCU</button>
        <div id="status">Waiting for connection...</div>
    </div>
    
    <!-- 全画面画像表示エリア -->
    <img id="displayImage" src="whissen_wait.png" alt="Dispenser Status">

<script>
// ==========================================
// Settings
// ==========================================
const BAUD_RATE = 1152000; 
const SAMPLES = 512;
const PACKET_SIZE = 512 * 2 * 2; 

const SAMPLE_RATE = 80000; 
const BIN_RES = SAMPLE_RATE / SAMPLES; 
const BIN_15K = Math.round(18000 / BIN_RES); 
const BIN_20K = Math.round(19000 / BIN_RES); 

const THRESHOLD = 1000; // ★ 感度調整用
const HOLD_TIME_MS = 2000; // 表示を維持する時間 (ミリ秒)

let port;
let reader;
let isConnected = false;

// State Variables
let displayState = "WAITING"; 
let currentDisplayedState = ""; // 現在表示中の状態を記録（無駄な書き換えを防ぐため）
let lastDetectTime = 0;

// 画像エレメント
const imgElement = document.getElementById('displayImage');

// 画像のパス
const IMG_WAIT = 'whissen_wait.png';
const IMG_SOAP = 'whissen_soap.png';
const IMG_ALCOHOL = 'whissen_alcohol.png';

// 切り替え時のちらつきを防ぐために画像をプリロード
(new Image()).src = IMG_WAIT;
(new Image()).src = IMG_SOAP;
(new Image()).src = IMG_ALCOHOL;

// 起動時からUI更新ループを開始
requestAnimationFrame(updateLoop);

// ==========================================
// Serial Communication
// ==========================================
async function connect() {
    try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: BAUD_RATE });
        
        isConnected = true;
        
        // 接続成功したらUIを隠す
        document.getElementById('setup-ui').style.display = 'none';
        
        readLoop();
    } catch (e) {
        console.error(e);
        document.getElementById('status').innerText = "Error: " + e.message;
    }
}

async function readLoop() {
    reader = port.readable.getReader();
    let buffer = new Uint8Array(0);

    try {
        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            
            let newBuffer = new Uint8Array(buffer.length + value.length);
            newBuffer.set(buffer);
            newBuffer.set(value, buffer.length);
            buffer = newBuffer;

            for (let i = 0; i < buffer.length - 1; i++) {
                if (buffer[i] === 0xAA && buffer[i+1] === 0xBB) {
                    if (buffer.length - i >= PACKET_SIZE + 2) {
                        let rawData = buffer.slice(i + 2, i + 2 + PACKET_SIZE);
                        processAudioData(rawData);
                        buffer = buffer.slice(i + 2 + PACKET_SIZE);
                        break; 
                    }
                }
            }
            if (buffer.length > PACKET_SIZE * 3) {
                buffer = new Uint8Array(0);
            }
        }
    } catch (e) {
        console.error(e);
    } finally {
        reader.releaseLock();
    }
}

function processAudioData(rawData) {
    let dataView = new DataView(rawData.buffer, rawData.byteOffset, rawData.byteLength);
    let real = new Float32Array(SAMPLES);
    
    for (let j = 0; j < SAMPLES; j++) {
        let sample = dataView.getInt16(j * 4, true); 
        let multiplier = 0.5 * (1 - Math.cos(2 * Math.PI * j / (SAMPLES - 1)));
        real[j] = sample * multiplier;
    }
    
    let fftResult = computeFFT(real);
    detectDispenser(fftResult);
}

function detectDispenser(fft) {
    let maxVal = 0;
    let maxIndex = 0;
    
    for (let i = 0; i < fft.length; i++) {
        if (fft[i] > maxVal) {
            maxVal = fft[i];
            maxIndex = i;
        }
    }

    if (maxVal > THRESHOLD) {
        let dist15k = Math.abs(maxIndex - BIN_15K);
        let dist20k = Math.abs(maxIndex - BIN_20K);

        if (dist15k < 20 || dist20k < 20) {
            if (dist15k < dist20k) {
                displayState = "SOAP";
            } else {
                displayState = "ALCOHOL";
            }
            lastDetectTime = Date.now(); 
        }
    }
}

// FFT Algorithm (Cooley-Tukey Radix-2)
function computeFFT(real) {
    let n = real.length;
    let imag = new Float32Array(n);
    let j = 0;
    for (let i = 0; i < n - 1; i++) {
        if (i < j) { let tr = real[j]; real[j] = real[i]; real[i] = tr; }
        let k = n >> 1;
        while (k <= j) { j -= k; k >>= 1; }
        j += k;
    }
    for (let size = 2; size <= n; size *= 2) {
        let halfSize = size / 2;
        let tablestep = n / size;
        for (let i = 0; i < n; i += size) {
            for (let k = i, m = 0; k < i + halfSize; k++, m += tablestep) {
                let angle = -2 * Math.PI * m / n;
                let c = Math.cos(angle);
                let s = Math.sin(angle);
                let t_real = real[k + halfSize] * c - imag[k + halfSize] * s;
                let t_imag = real[k + halfSize] * s + imag[k + halfSize] * c;
                real[k + halfSize] = real[k] - t_real;
                imag[k + halfSize] = imag[k] - t_imag;
                real[k] += t_real;
                imag[k] += t_imag;
            }
        }
    }
    let magnitudes = new Float32Array(n / 2);
    for(let i = 0; i < n / 2; i++) {
        magnitudes[i] = Math.sqrt(real[i]*real[i] + imag[i]*imag[i]);
    }
    return magnitudes;
}

// ==========================================
// Rendering / UI Update
// ==========================================
function updateLoop() {
    // 時間経過でWAITINGに戻す
    if (displayState !== "WAITING" && Date.now() - lastDetectTime > HOLD_TIME_MS) {
        displayState = "WAITING";
    }

    // 状態が変更された時のみ画像のsrcを書き換える
    if (currentDisplayedState !== displayState) {
        if (displayState === "SOAP") {
            imgElement.src = IMG_SOAP;
        } else if (displayState === "ALCOHOL") {
            imgElement.src = IMG_ALCOHOL;
        } else {
            imgElement.src = IMG_WAIT;
        }
        currentDisplayedState = displayState;
    }
    
    requestAnimationFrame(updateLoop);
}

document.getElementById('connectBtn').addEventListener('click', connect);

</script>
</body>
</html>
